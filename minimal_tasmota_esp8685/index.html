<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>smartplug 대시보드</title>
  <style>
    :root {
      --background: #f4f6fa;
      --foreground: #111827;
      --card: #ffffff;
      --muted: #eef2f7;
      --muted-foreground: #98a2b3;
      --border: #dbe3ec;
      --plug-on: #2ca760;
      --plug-on-bg: #e9f7ef;
      --plug-off: #7b879f;
      --plug-off-bg: #eceff4;
      --offline: #d97706;
      --card-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
      --card-shadow-on: 0 18px 46px rgba(44, 167, 96, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: linear-gradient(180deg, #f8fafc 0%, var(--background) 100%);
      color: var(--foreground);
      font-family: Inter, "Noto Sans KR", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 28px;
      border-bottom: 1px solid #d9e1ea;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--plug-on);
      color: white;
      font-size: 18px;
      font-weight: 800;
      box-shadow: 0 8px 18px rgba(44, 167, 96, 0.24);
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand-subtitle {
      margin: 2px 0 0;
      color: #6b7280;
      font-size: 13px;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #fff;
      color: #667085;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.05);
    }

    .status-chip::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #cbd5e1;
    }

    .status-chip.connected::before {
      background: var(--plug-on);
    }

    .content {
      width: 100%;
      max-width: 1320px;
      margin: 0 auto;
      padding: 32px 24px 48px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(1, minmax(0, 1fr));
      gap: 22px;
    }

    .empty {
      display: none;
      align-items: center;
      justify-content: center;
      min-height: 240px;
      border-radius: 28px;
      border: 1px dashed var(--border);
      background: rgba(255, 255, 255, 0.75);
      color: #667085;
    }

    .outer-card {
      position: relative;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: var(--card-shadow);
      padding: 30px 24px 22px;
      transition: box-shadow 0.25s ease, transform 0.25s ease, opacity 0.25s ease;
    }

    .outer-card.on {
      box-shadow: var(--card-shadow-on);
    }

    .outer-card.offline {
      opacity: 0.72;
    }

    .outer-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 64px;
      height: 4px;
      border-bottom-left-radius: 999px;
      border-bottom-right-radius: 999px;
      background: #d7dce3;
    }

    .outer-card.on::before {
      background: var(--plug-on);
    }

    .outer-card.offline::before {
      background: var(--offline);
    }

    .power-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
    }

    .power-icon {
      width: 64px;
      height: 64px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      background: var(--plug-off-bg);
      color: var(--plug-off);
      transition: all 0.25s ease;
    }

    .outer-card.on .power-icon {
      background: var(--plug-on-bg);
      color: var(--plug-on);
      box-shadow: 0 0 24px rgba(44, 167, 96, 0.18);
    }

    .inner-card {
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(248, 250, 252, 0.88);
      padding: 16px 16px 14px;
    }

    .name-row {
      display: flex;
      align-items: start;
      gap: 8px;
      margin-bottom: 6px;
    }

    .device-name {
      flex: 1 1 auto;
      min-width: 0;
      margin: 0;
      font-size: 16px;
      line-height: 1.4;
      font-weight: 800;
      text-align: left;
      word-break: break-word;
    }

    .name-input {
      width: 100%;
      min-width: 0;
      font: inherit;
      padding: 6px 0;
      border: none;
      border-bottom: 1px solid #c6cfdb;
      background: transparent;
      color: var(--foreground);
      outline: none;
    }

    .icon-btn {
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: #7b879f;
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
    }

    .device-id {
      margin: 0 0 10px;
      color: #7b879f;
      font-size: 12px;
      font-family: Consolas, monospace;
      text-align: left;
      word-break: break-all;
    }

    .badge-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .state-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--plug-off);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .state-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #d0d5dd;
    }

    .outer-card.on .state-badge {
      color: var(--plug-on);
    }

    .outer-card.on .state-dot {
      background: var(--plug-on);
      box-shadow: 0 0 0 4px rgba(44, 167, 96, 0.10);
    }

    .outer-card.offline .state-badge {
      color: var(--offline);
    }

    .outer-card.offline .state-dot {
      background: var(--offline);
      box-shadow: 0 0 0 4px rgba(217, 119, 6, 0.10);
    }

    .web-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: 999px;
      background: #e8eefb;
      color: #334155;
      font-size: 10px;
      font-weight: 800;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn {
      flex: 1 1 0;
      border: none;
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.18s ease;
    }

    .btn-on {
      background: #eef2f7;
      color: #60708a;
    }

    .btn-off {
      background: var(--plug-off);
      color: white;
    }

    .outer-card.on .btn-on {
      background: var(--plug-on);
      color: white;
      box-shadow: 0 8px 18px rgba(44, 167, 96, 0.20);
    }

    .outer-card.on .btn-off {
      background: #e8edf3;
      color: #60708a;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .network-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
      color: #98a2b3;
      font-size: 12px;
    }

    .network-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }

    .network-item span:last-child {
      word-break: break-all;
    }

    .last-seen {
      color: #98a2b3;
      font-size: 12px;
      text-align: left;
    }

    @media (min-width: 760px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (min-width: 1120px) {
      .grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (min-width: 1420px) {
      .grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">⏻</div>
        <div class="brand-copy">
          <h1 class="brand-title">Smart Plug Dashboard</h1>
          <p class="brand-subtitle" id="deviceCount">0 devices</p>
        </div>
      </div>
      <div id="mqttStatus" class="status-chip">MQTT 연결 확인 중</div>
    </header>

    <main class="content">
      <section id="empty" class="empty">아직 수신된 장치가 없습니다.</section>
      <section id="grid" class="grid"></section>
    </main>
  </div>

  <script>
    const devices = new Map();
    const customNames = loadCustomNames();
    let eventSource = null;

    const els = {
      mqttStatus: document.getElementById('mqttStatus'),
      empty: document.getElementById('empty'),
      grid: document.getElementById('grid'),
      deviceCount: document.getElementById('deviceCount')
    };

    function loadCustomNames() {
      try {
        return JSON.parse(localStorage.getItem('smartplugCustomNames') || '{}');
      } catch (_) {
        return {};
      }
    }

    function saveCustomNames() {
      localStorage.setItem('smartplugCustomNames', JSON.stringify(customNames));
    }

    function ensureDevice(uuid) {
      if (!devices.has(uuid)) {
        devices.set(uuid, {
          uuid,
          name: customNames[uuid] || uuid,
          state: 'unknown',
          webserver: null,
          ssid: '',
          ipAddress: '',
          lastSeen: '',
          online: true
        });
      }
      return devices.get(uuid);
    }

    function normalizeState(value) {
      const state = String(value || '').toLowerCase();
      if (state === 'on') return 'on';
      if (state === 'off') return 'off';
      return 'unknown';
    }

    function mergePlug(data) {
      const plug = ensureDevice(data.uuid);
      plug.name = customNames[data.uuid] || plug.name || data.uuid;
      plug.state = normalizeState(data.state);
      plug.webserver = typeof data.webserver === 'number' ? data.webserver : plug.webserver;
      plug.ssid = data.ssid || plug.ssid || '';
      plug.ipAddress = data.ipAddress || plug.ipAddress || '';
      plug.lastSeen = data.lastSeen || plug.lastSeen || '';
      plug.online = data.online !== false;
    }

    function formatLastSeen(value) {
      if (!value) return '—';
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return '—';
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      const hour = d.getHours();
      const min = String(d.getMinutes()).padStart(2, '0');
      const ampm = hour < 12 ? '오전' : '오후';
      const h12 = hour % 12 || 12;
      return `${yyyy}-${mm}-${dd} ${ampm} ${h12}:${min}`;
    }

    async function sendCommand(uuid, cmd) {
      const response = await fetch(`/api/plugs/${encodeURIComponent(uuid)}/command`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cmd })
      });

      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        alert(data.error || '명령 전송에 실패했습니다.');
      }
    }

    function render() {
      const plugs = [...devices.values()].sort((a, b) => a.uuid.localeCompare(b.uuid));
      els.deviceCount.textContent = `${plugs.length} devices`;
      els.empty.style.display = plugs.length === 0 ? 'flex' : 'none';
      els.grid.innerHTML = '';

      for (const plug of plugs) {
        const isOn = plug.online && plug.state === 'on';
        const stateText = plug.online ? (plug.state === 'on' ? 'ON' : plug.state === 'off' ? 'OFF' : 'UNKNOWN') : 'OFFLINE';
        const article = document.createElement('article');
        article.className = `outer-card ${isOn ? 'on' : ''} ${plug.online ? '' : 'offline'}`;
        article.innerHTML = `
          <div class="power-wrap">
            <div class="power-icon">⏻</div>
          </div>

          <div class="inner-card">
            <div class="name-row">
              <h2 class="device-name" data-role="device-name">${plug.name}</h2>
              <button class="icon-btn" type="button" data-action="edit-name" data-id="${plug.uuid}">✎</button>
            </div>

            <p class="device-id">${plug.uuid}</p>

            <div class="badge-row">
              <div class="state-badge">
                <span class="state-dot"></span>
                <span>${stateText}</span>
              </div>
              ${plug.webserver !== null ? `<span class="web-badge">WEB ${plug.webserver}</span>` : ''}
            </div>

            <div class="actions">
              <button class="btn btn-on" type="button" data-id="${plug.uuid}" data-cmd="on" ${plug.online ? '' : 'disabled'}>ON</button>
              <button class="btn btn-off" type="button" data-id="${plug.uuid}" data-cmd="off" ${plug.online ? '' : 'disabled'}>OFF</button>
            </div>

            <div class="network-row">
              <div class="network-item"><span>⌁</span><span>${plug.ssid || '-'}</span></div>
              <div class="network-item"><span>⊙</span><span>${plug.ipAddress || '-'}</span></div>
            </div>

            <div class="last-seen">마지막 수신: ${formatLastSeen(plug.lastSeen)}</div>
          </div>
        `;
        els.grid.appendChild(article);
      }
    }

    function beginEditName(button) {
      const uuid = button.dataset.id;
      const card = button.closest('.outer-card');
      const title = card.querySelector('[data-role="device-name"]');
      const currentName = customNames[uuid] || title.textContent.trim() || uuid;
      const input = document.createElement('input');
      input.className = 'name-input';
      input.value = currentName;
      input.maxLength = 60;
      title.replaceWith(input);
      button.textContent = '✓';
      button.dataset.action = 'save-name';
      input.focus();
      input.select();
    }

    function saveEditName(button) {
      const uuid = button.dataset.id;
      const card = button.closest('.outer-card');
      const input = card.querySelector('.name-input');
      const nextName = (input.value || '').trim() || uuid;
      customNames[uuid] = nextName;
      saveCustomNames();
      if (devices.has(uuid)) {
        devices.get(uuid).name = nextName;
      }
      render();
    }

    async function loadSnapshot() {
      const response = await fetch('/api/plugs');
      if (!response.ok) throw new Error('snapshot failed');
      const data = await response.json();
      devices.clear();
      for (const plug of data.plugs) {
        mergePlug(plug);
      }
      els.mqttStatus.textContent = data.mqtt.connected ? 'MQTT 연결됨' : 'MQTT 재연결 중';
      els.mqttStatus.classList.toggle('connected', !!data.mqtt.connected);
      render();
    }

    function connectEvents() {
      if (eventSource) eventSource.close();
      eventSource = new EventSource('/api/events');

      eventSource.addEventListener('snapshot', (event) => {
        const data = JSON.parse(event.data);
        devices.clear();
        for (const plug of data.plugs) {
          mergePlug(plug);
        }
        els.mqttStatus.textContent = data.mqtt.connected ? 'MQTT 연결됨' : 'MQTT 재연결 중';
        els.mqttStatus.classList.toggle('connected', !!data.mqtt.connected);
        render();
      });

      eventSource.addEventListener('plug', (event) => {
        const data = JSON.parse(event.data);
        mergePlug(data);
        render();
      });

      eventSource.addEventListener('mqtt', (event) => {
        const data = JSON.parse(event.data);
        els.mqttStatus.textContent = data.connected ? 'MQTT 연결됨' : 'MQTT 재연결 중';
        els.mqttStatus.classList.toggle('connected', !!data.connected);
      });
    }

    els.grid.addEventListener('click', async (event) => {
      const actionButton = event.target.closest('button[data-action][data-id]');
      if (actionButton) {
        if (actionButton.dataset.action === 'edit-name') {
          beginEditName(actionButton);
          return;
        }
        if (actionButton.dataset.action === 'save-name') {
          saveEditName(actionButton);
          return;
        }
      }

      const button = event.target.closest('button[data-id][data-cmd]');
      if (!button) return;
      await sendCommand(button.dataset.id, button.dataset.cmd);
    });

    loadSnapshot().catch(() => {});
    connectEvents();
    render();
  </script>
</body>
</html>
