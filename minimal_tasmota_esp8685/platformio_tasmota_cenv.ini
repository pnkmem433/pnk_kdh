; ESP8685 / ESP32-C3 pure Tasmota work environments
;
; This standalone copy is for:
; 1) verifying stock-like Tasmota boot/AP/WebUI on the custom ESP8685 board
; 2) rebuilding locally modified Tasmota code for the same board afterwards
; 3) keeping a UART-flashable ESP32-C3 worktree separate from the ESP-02S work
;
; Important: the actual chip has already reported "Embedded Flash 4MB (XMC)"
; over esptool, so the primary working target is 4MB flash, not the older 2MB
; experiment. The 2MB board/env files are kept only as references.

[env:tasmota32c3-smartplug-lite]
extends                 = env:tasmota32_base
board                   = esp32c3
build_unflags           = -DARDUINO_USB_MODE=1
extra_scripts           = ${env:tasmota32_base.extra_scripts}
                          pre:pio-tools/set-code-image.py
build_flags             = ${env:tasmota32_base.build_flags}
                          -UUSE_USB_CDC_CONSOLE
                          -DARDUINO_USB_MODE=0
                          -DARDUINO_USB_CDC_ON_BOOT=0
                          -DUSE_SMARTPLUG_CUSTOM
                          -DFIRMWARE_TASMOTA32
                          -DMQTT_MAX_PACKET_SIZE=512
                          -DLOG_LEVEL=0
                          -DCONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=n
lib_ignore              = ${env:tasmota32_base.lib_ignore}
                          Micro-RTSP

[env:tasmota32c3-work-safeboot]
extends                 = env:tasmota32_base
board                   = esp32c3
board_build.app_partition_name = safeboot
build_flags             = ${env:tasmota32_base.build_flags}
                          -DFIRMWARE_SAFEBOOT
                          -DCODE_IMAGE_STR='"tasmota32c3-work-safeboot"'
                          -DOTA_URL='"http://ota.tasmota.com/tasmota32/release/tasmota32c3.bin"'
                          -DCONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=n
lib_extra_dirs          = lib/lib_ssl, lib/libesp32
lib_ignore              = ${safeboot_flags.lib_ignore}

[env:tasmota32c3-work]
extends                 = env:tasmota32_base
board                   = esp32c3
build_unflags           = -DARDUINO_USB_MODE=1
build_flags             = ${env:tasmota32_base.build_flags}
                          -UUSE_USB_CDC_CONSOLE
                          -DARDUINO_USB_MODE=0
                          -DARDUINO_USB_CDC_ON_BOOT=0
                          -DUSE_SMARTPLUG_CUSTOM
                          -DFIRMWARE_TASMOTA32
                          -DOTA_URL='"http://ota.tasmota.com/tasmota32/release/tasmota32c3.bin"'
                          -DCONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=n
lib_ignore              = ${env:tasmota32_base.lib_ignore}
                          Micro-RTSP

[env:tasmota32c3-ota-bridge]
extends                 = env:tasmota32_base
board                   = esp32c3
build_unflags           = -DARDUINO_USB_MODE=1
build_flags             = ${env:tasmota32_base.build_flags}
                          -UUSE_USB_CDC_CONSOLE
                          -DARDUINO_USB_MODE=0
                          -DARDUINO_USB_CDC_ON_BOOT=0
                          -DFIRMWARE_SAFEBOOT
                          -DFIRMWARE_OTA_BRIDGE
                          -DCODE_IMAGE_STR='"tasmota32c3-ota-bridge"'
                          -DOTA_URL='"http://ota.tasmota.com/tasmota32/release/tasmota32c3.bin"'
                          -DCONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=n
lib_extra_dirs          = lib/lib_ssl, lib/libesp32
lib_ignore              = ${safeboot_flags.lib_ignore}

[env:tasmota32c3-partition-bridge]
extends                 = env:tasmota32_base
board                   = esp32c3
board_build.partitions  = partitions/esp32_partition_app1856k_fs320k.csv
build_unflags           = -DARDUINO_USB_MODE=1
build_flags             = ${env:tasmota32_base.build_flags}
                          -UUSE_USB_CDC_CONSOLE
                          -DARDUINO_USB_MODE=0
                          -DARDUINO_USB_CDC_ON_BOOT=0
                          -DFIRMWARE_MINIMAL
                          -DFIRMWARE_PARTITION_BRIDGE
                          -DFIRMWARE_OTA_BRIDGE
                          -DCODE_IMAGE_STR='"tasmota32c3-partition-bridge"'
                          -DOTA_URL='"http://ota.tasmota.com/tasmota32/release/tasmota32c3.bin"'
                          -DTASMOTA_MIGRATION_SAFEBOOT_URL='"http://192.168.0.84:3004/firmwareDownload/migration-real-safeboot?chipType=esp8685"'
                          -DCONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=n
lib_ignore              = ${env:tasmota32_base.lib_ignore}
                          Micro-RTSP
custom_files_upload     = ${env:tasmota32_base.custom_files_upload}
                          tasmota/berry/extensions/Partition_Wizard.tapp

