<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OTA 버전 생성 UI 목업</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #121a33;
        --panel-2: #1a2445;
        --line: #31406f;
        --text: #f4f7ff;
        --muted: #97a3c7;
        --primary: #4f8cff;
        --primary-2: #3d74df;
        --button-dark: #2a3868;
        --field: #0f1730;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top left, rgba(79, 140, 255, 0.18), transparent 24%),
          linear-gradient(180deg, #09101f 0%, #0d1326 100%);
        color: var(--text);
        font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      }

      .modal {
        width: min(920px, 100%);
        border: 1px solid #31406f;
        border-radius: 18px;
        background: linear-gradient(180deg, rgba(30, 42, 80, 0.96), rgba(19, 28, 55, 0.98));
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        padding: 22px 20px 20px;
      }

      .title {
        margin: 0 0 14px;
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 14px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .field.span-2 {
        grid-column: span 2;
      }

      .field.span-3 {
        grid-column: span 3;
      }

      label {
        font-size: 0.95rem;
        color: var(--text);
        font-weight: 700;
      }

      input,
      select {
        width: 100%;
        height: 52px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--field);
        color: var(--text);
        padding: 0 16px;
        font-size: 1rem;
        outline: none;
      }

      input::placeholder {
        color: #8a96ba;
      }

      input:focus,
      select:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(79, 140, 255, 0.18);
      }

      .file-box {
        height: 52px;
        display: flex;
        align-items: center;
        gap: 10px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--field);
        padding: 8px 12px;
      }

      .file-box input[type="file"] {
        display: none;
      }

      .file-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 36px;
        padding: 0 14px;
        border-radius: 9px;
        border: 1px solid #95a4cf;
        background: #f5f7ff;
        color: #111a35;
        cursor: pointer;
        font-size: 0.95rem;
        font-weight: 700;
        white-space: nowrap;
      }

      .file-name {
        color: var(--muted);
        font-size: 0.95rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin-top: 18px;
      }

      .btn {
        height: 54px;
        border: 0;
        border-radius: 12px;
        font-size: 1.08rem;
        font-weight: 800;
        cursor: pointer;
      }

      .btn.cancel {
        background: var(--button-dark);
        color: var(--text);
      }

      .btn.submit {
        background: linear-gradient(180deg, var(--primary), var(--primary-2));
        color: white;
      }

      .hint {
        margin-top: 14px;
        color: var(--muted);
        font-size: 0.92rem;
      }

      @media (max-width: 860px) {
        .grid {
          grid-template-columns: 1fr;
        }

        .field.span-2,
        .field.span-3 {
          grid-column: span 1;
        }
      }
    </style>
  </head>
  <body>
    <section class="modal" aria-label="새 버전 생성">
      <h1 class="title">새 버전 생성</h1>

      <div class="grid">
        <div class="field">
          <label for="version-number">버전 번호*</label>
          <input id="version-number" type="text" placeholder="예: 21">
        </div>

        <div class="field">
          <label for="version-name">버전 이름*</label>
          <input id="version-name" type="text" placeholder="예: v3.3.1">
        </div>

        <div class="field span-3">
          <label for="bin-file">Bin 파일*</label>
          <div class="file-box">
            <label class="file-button" for="bin-file">파일 선택</label>
            <input id="bin-file" type="file" accept=".bin,.gz,.bin.gz">
            <span id="file-name" class="file-name">선택된 파일 없음</span>
          </div>
        </div>

        <div class="field">
          <label for="chip-type">칩 종류*</label>
          <select id="chip-type">
            <option value="" selected disabled>선택하세요</option>
            <option value="esp02s">esp02s</option>
            <option value="esp8685">esp8685</option>
          </select>
        </div>

        <div class="field">
          <label for="firmware-family">펌웨어 계열*</label>
          <select id="firmware-family">
            <option value="" selected disabled>선택하세요</option>
            <option value="custom">자체제작</option>
            <option value="tasmota">타스모타</option>
          </select>
        </div>
      </div>

      <div class="actions">
        <button class="btn cancel" type="button">닫기</button>
        <button class="btn submit" type="button">생성</button>
      </div>

      <p class="hint">
        UI 목업입니다. `칩 종류`와 `펌웨어 계열`은 드롭다운 선택형으로 추가한 예시입니다.
      </p>
    </section>

    <script>
      const fileInput = document.getElementById("bin-file");
      const fileName = document.getElementById("file-name");

      fileInput.addEventListener("change", () => {
        const selected = fileInput.files && fileInput.files[0];
        fileName.textContent = selected ? selected.name : "선택된 파일 없음";
      });
    </script>
  </body>
</html>
