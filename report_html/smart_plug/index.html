<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스마트 플러그 기록 목록</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body data-topic="smart_plug" data-section-theme="emerald" class="min-h-screen bg-slate-50 text-slate-900">
  <main class="mx-auto max-w-4xl px-6 py-14">
    <section id="archive-overview" class="rounded-[2rem] border border-slate-200 bg-white p-8 shadow-sm">
      <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <div>
          <div class="text-xs font-semibold uppercase tracking-[0.18em] text-slate-500">Report Archive</div>
          <h1 id="archive-title" class="mt-3 text-3xl font-black text-slate-950">스마트 플러그 기록 목록</h1>
          <p id="archive-description" class="mt-3 text-sm leading-7 text-slate-600">스마트 플러그 관련 최신 보고서와 이후 기록을 이 폴더에서 관리합니다.</p>
        </div>
        <a href="../index.html" class="text-sm font-semibold text-sky-700 underline">메인 홈으로</a>
      </div>

      <div class="mt-8 space-y-4">
        <a id="latest-link" href="./index.html" class="flex items-center justify-between rounded-2xl border border-emerald-200 bg-emerald-50 px-5 py-4 transition hover:bg-emerald-100">
          <div>
            <div id="latest-title" class="font-semibold text-emerald-950">최신 스마트 플러그 보고서</div>
            <div id="latest-subtitle" class="text-xs text-emerald-700">현재 정리된 최신 내용 확인</div>
          </div>
          <span id="latest-badge" class="rounded-full border border-emerald-300 bg-white px-3 py-1 text-xs font-semibold text-emerald-700">최신</span>
        </a>

        <details class="rounded-2xl border border-slate-200 bg-slate-50 open:bg-white">
          <summary class="cursor-pointer list-none px-5 py-4">
            <div class="flex items-center justify-between gap-4">
              <div>
                <div id="history-title" class="font-semibold text-slate-950">이전 보고서 기록</div>
                <div id="history-description" class="mt-1 text-xs text-slate-600">이전에 만든 HTML 기록을 펼쳐서 볼 수 있습니다.</div>
              </div>
              <span class="rounded-full border border-slate-300 bg-white px-3 py-1 text-xs font-semibold text-slate-700">열기</span>
            </div>
          </summary>
          <div id="record-list" class="space-y-3 border-t border-slate-200 px-5 py-4"></div>
        </details>
      </div>
    </section>
  </main>

  <script src="../report_registry.js"></script>
  <script src="../archive_index.js"></script>
  <script src="../common_section_nav.js"></script>
  <script src="../common_auto_reload.js"></script>
</body>
</html>
