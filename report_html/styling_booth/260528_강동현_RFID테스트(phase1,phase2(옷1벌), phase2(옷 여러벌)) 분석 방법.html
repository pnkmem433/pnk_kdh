<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>260528_RFID 테스트 결과 보고(phase1, phase2(옷1벌), phase2(옷 여러벌))</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body data-section-theme="sky" class="min-h-screen bg-slate-50 text-slate-900">
  <main class="mx-auto max-w-5xl px-6 py-10 lg:px-8">
    <section id="analysis-overview" class="rounded-[2rem] border border-slate-200 bg-white p-6 shadow-sm lg:p-8">
      <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <div>
          <div class="text-xs font-semibold uppercase tracking-[0.18em] text-slate-500">Styling Booth Record</div>
          <h1 class="mt-3 text-3xl font-black text-slate-950">260528_RFID 테스트 결과 보고(phase1, phase2(옷1벌), phase2(옷 여러벌))</h1>
          <p class="mt-3 text-sm leading-7 text-slate-600">원본 Markdown 문서를 그대로 읽을 수 있도록 옮긴 기록본입니다.</p>
        </div>
        <div class="flex flex-wrap gap-3 text-sm font-semibold">
          <a href="./index.html" class="text-sky-700 underline">기록 목록으로</a>
          <a href="../index.html" class="text-sky-700 underline">메인 홈으로</a>
        </div>
      </div>

      <div class="mt-6 flex flex-wrap gap-3">
        <a href="./260528_%EA%B0%95%EB%8F%99%ED%98%84_RFID%ED%85%8C%EC%8A%A4%ED%8A%B8%28phase1%2Cphase2%28%EC%98%B71%EB%B2%8C%29%2C%20phase2%28%EC%98%B7%20%EC%97%AC%EB%9F%AC%EB%B2%8C%29%29%20%EB%B6%84%EC%84%9D%20%EB%B0%A9%EB%B2%95.md" download class="rounded-full border border-slate-300 bg-slate-50 px-4 py-2 text-sm font-semibold text-slate-800 transition hover:bg-slate-100">원본 MD 다운로드</a>
        <a href="./260528_%EA%B0%95%EB%8F%99%ED%98%84_RFID%ED%85%8C%EC%8A%A4%ED%8A%B8%28phase1%2Cphase2%28%EC%98%B71%EB%B2%8C%29%2C%20phase2%28%EC%98%B7%20%EC%97%AC%EB%9F%AC%EB%B2%8C%29%29%20%EB%B6%84%EC%84%9D%20%EB%B0%A9%EB%B2%95.md" target="_blank" rel="noreferrer" class="rounded-full border border-sky-300 bg-sky-50 px-4 py-2 text-sm font-semibold text-sky-800 transition hover:bg-sky-100">원본 MD 열기</a>
      </div>

      <div class="mt-8 rounded-[1.5rem] border border-slate-200 bg-slate-950 p-5 text-sm leading-7 text-slate-100 lg:p-6">
        <pre id="markdown-content" class="whitespace-pre-wrap break-words font-mono text-[13px] leading-7 text-slate-100">불러오는 중...</pre>
      </div>
    </section>
  </main>

  <script src="../common_section_nav.js"></script>
  <script src="../common_auto_reload.js"></script>
  <script>
    fetch("./260528_%EA%B0%95%EB%8F%99%ED%98%84_RFID%ED%85%8C%EC%8A%A4%ED%8A%B8%28phase1%2Cphase2%28%EC%98%B71%EB%B2%8C%29%2C%20phase2%28%EC%98%B7%20%EC%97%AC%EB%9F%AC%EB%B2%8C%29%29%20%EB%B6%84%EC%84%9D%20%EB%B0%A9%EB%B2%95.md")
      .then((response) => response.text())
      .then((text) => {
        document.getElementById("markdown-content").textContent = text;
      })
      .catch(() => {
        document.getElementById("markdown-content").textContent = "문서를 불러오지 못했습니다.";
      });
  </script>
</body>
</html>
