<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RFID 테스트 결과 요약</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background:
        radial-gradient(circle at top left, rgba(14, 165, 233, 0.08), transparent 28%),
        radial-gradient(circle at top right, rgba(16, 185, 129, 0.08), transparent 24%),
        #f8fafc;
    }

    .shadow-soft {
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
    }
  </style>
</head>
<body data-section-theme="sky" class="min-h-screen text-slate-900">
  <main id="app"></main>

  <div id="imageModal" class="fixed inset-0 z-50 hidden bg-slate-100/95 p-4 backdrop-blur-sm md:p-8">
    <button
      id="closeModal"
      class="absolute right-4 top-4 rounded-full border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-800 shadow-sm"
    >
      닫기
    </button>
    <div class="flex h-full items-center justify-center">
      <div id="modalContent" class="w-full max-w-6xl overflow-hidden rounded-3xl border border-slate-300 bg-white shadow-2xl"></div>
    </div>
  </div>

  <script type="module">
    import {
      reportMeta,
      topIntro,
      causeFlow,
      topSummaryCards,
      impactRows,
      issueCauseCards,
      conditionCompareRows,
      quickConditionBlocks,
      keyConclusion,
      exampleSections,
      peopleSection,
      antennaSection,
      externalEvidence,
      solutionSection,
      supportNotes,
      testScopeSection,
      antennaReviewSection,
    } from "./data.js";

    const app = document.getElementById("app");
    const modal = document.getElementById("imageModal");
    const modalContent = document.getElementById("modalContent");
    const closeModal = document.getElementById("closeModal");

    const toneMap = {
      good: "border-emerald-200 bg-emerald-50 text-emerald-900",
      bad: "border-rose-200 bg-rose-50 text-rose-900",
      warn: "border-amber-200 bg-amber-50 text-amber-950",
      info: "border-sky-200 bg-sky-50 text-sky-900",
      neutral: "border-slate-200 bg-slate-50 text-slate-800",
    };

    const badgeMap = {
      good: "border-emerald-200 bg-emerald-100 text-emerald-800",
      bad: "border-rose-200 bg-rose-100 text-rose-800",
      warn: "border-amber-200 bg-amber-100 text-amber-900",
      info: "border-sky-200 bg-sky-100 text-sky-800",
      neutral: "border-slate-200 bg-slate-100 text-slate-700",
    };

    const gradeByRead = (value) => {
      if (value >= 40) return { icon: "🟢", label: "매우 좋음", tone: "good" };
      if (value >= 20) return { icon: "🟡", label: "좋음", tone: "warn" };
      if (value >= 5) return { icon: "🟠", label: "인식은 되나 약함", tone: "info" };
      return { icon: "🔴", label: "실패", tone: "bad" };
    };

    const formatNum = (value, digits = 2) => {
      if (value === null || value === undefined) return "미인식";
      return Number(value).toFixed(digits).replace(/\.00$/, "");
    };

    const getDriveId = (url = "") => {
      if (!url) return "";
      if (url.includes("open?id=")) return url.split("open?id=")[1].split("&")[0];
      if (url.includes("/file/d/")) return url.split("/file/d/")[1].split("/")[0];
      return "";
    };

    const resolveMedia = (src = "") => {
      const id = getDriveId(src);
      if (id) {
        return {
          image: `https://drive.google.com/thumbnail?id=${id}&sz=w3000`,
          open: `https://drive.google.com/open?id=${id}`,
        };
      }
      return { image: src, open: src };
    };

    const mediaFrame = (item, aspect = "aspect-[4/3]") => {
      if (!item?.src) {
        return `<div class="${aspect} flex items-center justify-center bg-slate-100 text-sm text-slate-500">사진 없음</div>`;
      }
      const media = resolveMedia(item.src);
      return `
        <div class="${aspect} overflow-hidden bg-slate-100">
          <img src="${media.image}" alt="${item.label || "이미지"}" class="h-full w-full object-cover" loading="lazy" referrerpolicy="no-referrer" />
        </div>
      `;
    };

    const imageOverlayButton = (item) => {
      if (!item?.src) return "";
      const media = resolveMedia(item.src);
      return `
        <button
          class="image-trigger absolute inset-0"
          data-src="${media.image}"
          data-open="${media.open}"
          data-label="${item.label || "이미지"}"
          aria-label="${item.label || "이미지"} 확대"
        ></button>
      `;
    };

    const mediaActions = (item) => {
      if (!item?.src) return "";
      const media = resolveMedia(item.src);
      return `
        <button
          class="image-trigger text-xs font-semibold text-sky-700 underline"
          data-src="${media.image}"
          data-open="${media.open}"
          data-label="${item.label || "이미지"}"
        >
          확대 보기
        </button>
        <a href="${media.open}" target="_blank" class="text-xs font-semibold text-sky-700 underline">새 탭 열기</a>
      `;
    };

    const tagRow = ([name, value]) => {
      const grade = gradeByRead(value);
      return `
        <div class="flex items-center justify-between rounded-xl bg-white px-3 py-2 text-sm">
          <span class="text-slate-700">${name}</span>
          <span class="font-semibold ${grade.tone === "bad" ? "text-rose-700" : grade.tone === "warn" ? "text-amber-700" : grade.tone === "info" ? "text-sky-700" : "text-emerald-700"}">${grade.icon} ${formatNum(value)}회</span>
        </div>
      `;
    };

    const exampleCard = (item, tone = "neutral") => {
      const grade = gradeByRead(item.meanRead);
      return `
        <article class="overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-sm">
          <div class="relative">
            ${mediaFrame(item)}
            ${imageOverlayButton(item)}
          </div>
          <div class="space-y-3 p-4">
            <div class="flex items-start justify-between gap-3">
              <div>
                <div class="text-lg font-bold text-slate-900">${item.label}</div>
                <div class="text-sm text-slate-500">${item.phase} ${item.testId}</div>
              </div>
              <span class="rounded-full border ${badgeMap[grade.tone]} px-3 py-1 text-xs font-semibold">${item.grade || `${grade.icon} ${grade.label}`}</span>
            </div>
            <div class="text-sm text-slate-700">${item.summary}</div>
            <div class="rounded-2xl ${toneMap[tone]} p-3 text-sm">
              <div class="font-semibold">${item.meanLabel || "평균 인식 횟수"}: ${formatNum(item.meanRead)}회</div>
              <div class="mt-1">${item.compareRead}</div>
            </div>
            ${item.reason ? `
              <div class="rounded-2xl border border-slate-200 bg-slate-50 p-3 text-sm leading-7 text-slate-700">
                <span class="font-semibold text-slate-900">원인:</span> ${item.reason}
              </div>
            ` : ""}
            ${item.tagReads?.length ? `
              <div class="rounded-2xl border border-slate-200 bg-slate-50 p-3">
                <div class="mb-2 text-xs font-semibold text-slate-600">전체 태그 평균 인식 횟수 (각 태그 5회 평균)</div>
                <div class="grid gap-2">${item.tagReads.map(tagRow).join("")}</div>
              </div>
            ` : ""}
            <div class="flex items-center justify-between gap-3">
              <div class="text-xs text-slate-500">사진이 안 보이면 공유 권한을 확인하세요.</div>
              <div class="flex items-center gap-3">${mediaActions(item)}</div>
            </div>
          </div>
        </article>
      `;
    };

    const visualCard = (item) => `
      <article class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
        <div class="relative">
          ${mediaFrame(item, "aspect-[16/10]")}
          ${imageOverlayButton(item)}
        </div>
        <div class="space-y-2 p-4">
          <div class="text-base font-bold text-slate-900">${item.label}</div>
          <div class="text-sm text-slate-700">${item.summary}</div>
          <div class="flex items-center justify-end gap-3">${mediaActions(item)}</div>
        </div>
      </article>
    `;

    const compactVisualCard = (item) => `
      <article class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
        <div class="relative">
          ${mediaFrame(item, "aspect-[4/3]")}
          ${imageOverlayButton(item)}
        </div>
        <div class="space-y-1 p-3">
          <div class="text-sm font-bold text-slate-900">${item.label}</div>
          <div class="text-xs text-slate-600">${item.summary}</div>
          <div class="flex items-center justify-end gap-3">${mediaActions(item)}</div>
        </div>
      </article>
    `;

    const issueCard = (item) => `
      <article class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm">
        <div class="flex items-start gap-3">
          <span class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-slate-900 text-sm font-bold text-white">${item.step}</span>
          <div class="min-w-0">
            <h4 class="text-lg font-bold text-slate-900">${item.title}</h4>
            <p class="mt-2 text-sm font-semibold text-slate-700">${item.summary}</p>
            <p class="mt-2 text-sm leading-7 text-slate-600">${item.detail}</p>
          </div>
        </div>
        ${item.qrMatrix?.length ? `
          <div class="mt-4">
            ${item.qrMatrixCaption ? `<div class="mb-2 text-sm font-semibold text-slate-600">${item.qrMatrixCaption}</div>` : ""}
          <div class="overflow-hidden rounded-2xl border border-slate-200">
            <div class="grid grid-cols-[1fr_0.8fr_0.8fr_1fr] gap-px bg-slate-200">
              <div class="bg-slate-50 px-3 py-3 text-sm font-bold">훅 위치</div>
              <div class="bg-slate-50 px-3 py-3 text-sm font-bold">QR 안 보이게</div>
              <div class="bg-slate-50 px-3 py-3 text-sm font-bold">QR 보이게</div>
              <div class="bg-slate-50 px-3 py-3 text-sm font-bold">해석</div>
              ${item.qrMatrix
                .map((row) => {
                  const hiddenGrade = gradeByRead(row.hidden);
                  const visibleGrade = gradeByRead(row.visible);
                  return `
                    <div class="bg-white px-3 py-3 text-sm font-semibold text-slate-900">${row.hook}</div>
                    <div class="bg-white px-3 py-3 text-sm font-bold ${hiddenGrade.tone === "bad" ? "text-rose-700" : hiddenGrade.tone === "warn" ? "text-amber-700" : hiddenGrade.tone === "info" ? "text-sky-700" : "text-emerald-700"}">${hiddenGrade.icon} ${formatNum(row.hidden)}회</div>
                    <div class="bg-white px-3 py-3 text-sm font-bold ${visibleGrade.tone === "bad" ? "text-rose-700" : visibleGrade.tone === "warn" ? "text-amber-700" : visibleGrade.tone === "info" ? "text-sky-700" : "text-emerald-700"}">${visibleGrade.icon} ${formatNum(row.visible)}회</div>
                    <div class="bg-white px-3 py-3 text-sm text-slate-700">${row.note}</div>
                  `;
                })
                .join("")}
            </div>
          </div>
          </div>
        ` : ""}
        ${item.imageColumns?.length ? `
          <div class="mt-4 grid gap-4 lg:grid-cols-3">
            ${item.imageColumns
              .map(
                (column) => `
                  <div class="rounded-2xl border border-slate-200 bg-slate-50 p-3">
                    <div class="mb-3 text-sm font-bold text-slate-900">${column.title}</div>
                    <div class="grid gap-3">
                      ${column.items.map(compactVisualCard).join("")}
                    </div>
                  </div>
                `,
              )
              .join("")}
          </div>
        ` : item.images?.length ? `
          <div class="mt-4 grid gap-4 sm:grid-cols-2">
            ${item.images.map(visualCard).join("")}
          </div>
        ` : ""}
      </article>
    `;

    const currentJudgmentSection = () => `
      <section class="rounded-[2rem] border border-slate-200 bg-white p-8 shadow-soft">
        <div>
          <div class="text-sm font-semibold uppercase tracking-[0.24em] text-slate-500">Current Judgment</div>
          <h2 class="mt-2 text-3xl font-black text-slate-950">${solutionSection.title}</h2>
          <p class="mt-4 text-sm leading-8 text-slate-700">${solutionSection.intro}</p>
        </div>
        ${solutionSection.priorityCards?.length ? `
          <div class="mt-6 grid gap-4 lg:grid-cols-3">
            ${solutionSection.priorityCards
              .map(
                (card) => `
                  <article class="rounded-3xl border ${toneMap[card.tone]} p-5 shadow-sm">
                    <div class="text-xs font-semibold uppercase tracking-[0.18em]">${card.label}</div>
                    <div class="mt-3 text-2xl font-black">${card.value}</div>
                    <p class="mt-2 text-sm leading-7">${card.text}</p>
                  </article>
                `,
              )
              .join("")}
          </div>
        ` : ""}
        <div class="mt-6 overflow-hidden rounded-3xl border border-slate-200">
          <div class="grid grid-cols-[1fr_1fr_1fr_1.2fr] gap-px bg-slate-200">
            <div class="bg-slate-50 px-4 py-3 text-sm font-bold">방법</div>
            <div class="bg-slate-50 px-4 py-3 text-sm font-bold">어떻게 적용하는가</div>
            <div class="bg-slate-50 px-4 py-3 text-sm font-bold">필요 조건</div>
            <div class="bg-slate-50 px-4 py-3 text-sm font-bold">한계</div>
            ${solutionSection.methods
              .map(
                (item) => `
                  <div class="px-4 py-4 text-sm font-semibold ${item.tone ? toneMap[item.tone] : "bg-white text-slate-900"}">
                    <div class="flex items-center justify-between gap-2">
                      <span>${item.name}</span>
                      ${item.badge ? `<span class="rounded-full border ${badgeMap[item.tone || "neutral"]} px-2 py-0.5 text-[11px] font-bold">${item.badge}</span>` : ""}
                    </div>
                  </div>
                  <div class="px-4 py-4 text-sm ${item.tone ? toneMap[item.tone] : "bg-white text-slate-700"}">${item.how}</div>
                  <div class="px-4 py-4 text-sm ${item.tone ? toneMap[item.tone] : "bg-white text-slate-700"}">${item.needs}</div>
                  <div class="px-4 py-4 text-sm ${item.tone ? toneMap[item.tone] : "bg-white text-slate-700"}">${item.limit}</div>
                `,
              )
              .join("")}
          </div>
        </div>
        <div class="mt-6 rounded-3xl border border-slate-200 bg-slate-50 p-5">
          <div class="text-lg font-black text-slate-950">현재 한계</div>
          <div class="mt-3 grid gap-2">
            ${solutionSection.limits
              .map((item) => `<div class="rounded-2xl bg-white px-4 py-3 text-sm text-slate-700">${item}</div>`)
              .join("")}
          </div>
        </div>
        <div class="mt-6 rounded-3xl border border-emerald-200 bg-emerald-50 p-6">
          <div class="text-lg font-black text-emerald-950">현재 판단</div>
          <div class="mt-3 grid gap-2">
            ${solutionSection.judgment
              .map((item, index) => `<div class="rounded-2xl bg-white px-4 py-3 text-sm ${index === 0 ? "font-bold text-emerald-900" : "text-slate-700"}">${item}</div>`)
              .join("")}
          </div>
          <div class="mt-5 rounded-2xl border border-emerald-200 bg-white px-4 py-4 text-sm font-bold leading-7 text-emerald-900">${solutionSection.finalLine}</div>
        </div>
      </section>
    `;

    const renderCompareBlock = (title, caption, goodItems = [], badItems = [], neutralItems = [], note = "", meanNote = "") => `
      <div class="rounded-3xl border border-slate-200 bg-slate-50 p-5">
        <div class="mb-4">
          <h4 class="text-xl font-bold text-slate-900">${title}</h4>
          <p class="mt-1 text-sm text-slate-600">${caption}</p>
          ${note ? `<p class="mt-3 rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm leading-7 text-slate-700">${note}</p>` : ""}
          ${meanNote ? `<p class="mt-2 text-xs font-semibold text-slate-500">${meanNote}</p>` : ""}
        </div>
        <div class="grid gap-5 ${neutralItems.length ? "xl:grid-cols-3" : "xl:grid-cols-2"}">
          ${goodItems.map((item) => exampleCard(item, "good")).join("")}
          ${badItems.map((item) => exampleCard(item, "bad")).join("")}
          ${neutralItems.map((item) => exampleCard(item, "neutral")).join("")}
        </div>
      </div>
    `;

    const highlightEvidenceIntro = (text) => {
      const targets = ["배치 환경", "안테나 위치", "공간 구조", "태그 방향", "밀집도"];
      return targets.reduce(
        (acc, word) =>
          acc.replaceAll(
            word,
            `<span class="rounded-md bg-amber-100 px-1.5 py-0.5 font-semibold text-amber-950">${word}</span>`,
          ),
        text,
      );
    };

    const createAntennaLineSvg = (cases) => {
      const categories = ["기존", "왼쪽", "중앙", "오른쪽"];
      const series = cases.map((item, index) => ({
        name: item.caseId,
        color: ["#e15241", "#3b82b6", "#2eaf67", "#e78a23"][index],
        points: [item.base, item.left, item.center, item.right],
      }));

      const width = 980;
      const height = 520;
      const pad = { top: 88, right: 30, bottom: 80, left: 72 };
      const chartW = width - pad.left - pad.right;
      const chartH = height - pad.top - pad.bottom;
      const max = 75;
      const xStep = chartW / (categories.length - 1);
      const x = (idx) => pad.left + idx * xStep;
      const y = (value) => pad.top + chartH - (value / max) * chartH;

      let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}" width="100%" height="460">`;
      svg += `<rect width="${width}" height="${height}" fill="#ffffff"/>`;
      svg += `<text x="${width / 2}" y="34" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">RFID Tag Read Count vs. Antenna Position</text>`;
      svg += `<text x="${width / 2}" y="66" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">파란셔츠(AA000010) 기준 - 기존 위치에서 0~4회인 실패 케이스 비교</text>`;

      for (let i = 0; i <= 7; i += 1) {
        const value = i * 10;
        const yy = y(value);
        svg += `<line x1="${pad.left}" y1="${yy}" x2="${width - pad.right}" y2="${yy}" stroke="#e2e8f0" stroke-width="1"/>`;
        svg += `<text x="${pad.left - 14}" y="${yy + 4}" text-anchor="end" font-size="12" fill="#475569">${value}</text>`;
      }

      categories.forEach((label, idx) => {
        const xx = x(idx);
        svg += `<line x1="${xx}" y1="${pad.top}" x2="${xx}" y2="${pad.top + chartH}" stroke="#e5e7eb" stroke-width="1"/>`;
        svg += `<text x="${xx}" y="${height - 34}" text-anchor="middle" font-size="14" fill="#111827">${label}</text>`;
      });

      series.forEach((line) => {
        const points = line.points.map((value, idx) => `${x(idx)},${y(value)}`).join(" ");
        svg += `<polyline points="${points}" fill="none" stroke="${line.color}" stroke-width="4"/>`;
        line.points.forEach((value, idx) => {
          const xx = x(idx);
          const yy = y(value);
          svg += `<circle cx="${xx}" cy="${yy}" r="7" fill="${line.color}"/>`;
          svg += `<text x="${xx}" y="${yy - 14}" text-anchor="middle" font-size="12" font-weight="700" fill="${line.color}">${value.toFixed(2)}</text>`;
        });
      });

      const thresholdY = y(5);
      svg += `<line x1="${pad.left}" y1="${thresholdY}" x2="${width - pad.right}" y2="${thresholdY}" stroke="#ef4444" stroke-width="4"/>`;
      svg += `<text x="${width - pad.right - 8}" y="${thresholdY - 8}" text-anchor="end" font-size="12" font-weight="700" fill="#dc2626">통과 기준 5회</text>`;

      const legendX = 92;
      const legendY = 104;
      svg += `<rect x="${legendX - 18}" y="${legendY - 30}" width="132" height="152" rx="12" fill="#ffffff" stroke="#d1d5db"/>`;
      series.forEach((line, idx) => {
        const yy = legendY + idx * 28;
        svg += `<line x1="${legendX}" y1="${yy}" x2="${legendX + 28}" y2="${yy}" stroke="${line.color}" stroke-width="4"/>`;
        svg += `<circle cx="${legendX + 14}" cy="${yy}" r="6" fill="${line.color}"/>`;
        svg += `<text x="${legendX + 44}" y="${yy + 5}" font-size="13" fill="#111827">${line.name}</text>`;
      });
      svg += `<line x1="${legendX}" y1="${legendY + 118}" x2="${legendX + 28}" y2="${legendY + 118}" stroke="#ef4444" stroke-width="4"/>`;
      svg += `<text x="${legendX + 44}" y="${legendY + 123}" font-size="13" fill="#111827">기준 5회</text>`;
      svg += `</svg>`;
      return svg;
    };

    const antennaValueClass = (value, max) =>
      value === max ? "border-emerald-200 bg-emerald-100 text-emerald-900" : "border-slate-200 bg-white text-slate-700";
    const testScopeCard = (group, tone = "neutral") => `
      <article class="rounded-3xl border ${toneMap[tone]} p-5 shadow-sm">
        <div class="text-lg font-black">${group.title}</div>
        <div class="mt-3 grid gap-2">
          ${group.items
            .map((item) => `<div class="rounded-2xl bg-white px-4 py-3 text-sm text-slate-700">${item}</div>`)
            .join("")}
        </div>
      </article>
    `;
    const testScopeSectionHtml = () => `
      <section id="test-scope" class="rounded-[2rem] border border-slate-200 bg-white p-8 shadow-soft">
        <div class="mb-6">
          <div class="text-sm font-semibold uppercase tracking-[0.24em] text-slate-500">Test Scope</div>
          <h2 class="mt-2 text-3xl font-black text-slate-950">${testScopeSection.title}</h2>
          <p class="mt-3 text-sm leading-8 text-slate-700">${testScopeSection.subtitle}</p>
          <div class="mt-4 rounded-3xl border border-sky-200 bg-sky-50 px-5 py-4 text-sm font-semibold leading-7 text-sky-950">
            ${testScopeSection.headline}
          </div>
        </div>
        <div class="grid gap-4 xl:grid-cols-3">
          ${testScopeSection.axes
            .map(
              (axis) => `
                <article class="rounded-3xl border border-slate-200 bg-slate-50 p-5">
                  <div class="text-lg font-black text-slate-950">${axis.name}</div>
                  <div class="mt-3 flex flex-wrap gap-2">
                    ${axis.options
                      .map(

          <div class="mt-6 overflow-hidden rounded-3xl border border-slate-200">
            <div class="grid grid-cols-[1fr_1.4fr_1fr] gap-px bg-slate-200">
              <div class="bg-slate-50 px-4 py-3 text-sm font-bold">출처</div>
              <div class="bg-slate-50 px-4 py-3 text-sm font-bold">간섭 관련 확인 내용</div>
              <div class="bg-slate-50 px-4 py-3 text-sm font-bold">시사점</div>
              ${externalEvidence.rows
                .map(
                  (row) => `
                    <div class="bg-white px-4 py-4 text-sm font-semibold text-slate-900"><a href="${row.href}" target="_blank" class="text-sky-700 underline">${row.source}</a></div>
                    <div class="bg-white px-4 py-4 text-sm text-slate-700">${row.finding}</div>
                    <div class="bg-white px-4 py-4 text-sm text-slate-700">${row.implication}</div>
                  `,
                )
                .join("")}
            </div>
          </div>
        </section>

        <section id="interpretation-rules" class="rounded-[2rem] border border-slate-200 bg-white p-8 shadow-soft">
          <h3 class="text-2xl font-black text-slate-950">${supportNotes.title}</h3>
          <p class="mt-4 text-sm leading-8 text-slate-700">${supportNotes.intro}</p>
          <div class="mt-6 grid gap-6 xl:grid-cols-2">
            <article class="rounded-3xl border border-slate-200 bg-slate-50 p-5">
              <div class="text-lg font-black text-slate-950">${supportNotes.readCountTitle}</div>
              <p class="mt-2 text-sm leading-7 text-slate-700">${supportNotes.readCountNote}</p>
              <div class="mt-4 overflow-hidden rounded-2xl border border-slate-200">
                <div class="grid grid-cols-[1fr_1fr] gap-px bg-slate-200">
                  <div class="bg-slate-50 px-4 py-3 text-sm font-bold">정상 인식 횟수(절사평균)</div>
                  <div class="bg-slate-50 px-4 py-3 text-sm font-bold">판정</div>
                  ${supportNotes.readCountRows
                    .map(
                      (row) => `
                        <div class="bg-white px-4 py-4 text-sm font-semibold text-slate-900">${row.range}</div>
                        <div class="px-4 py-4 text-sm font-bold ${toneMap[row.tone]}">${row.grade}</div>
                      `,
                    )
                    .join("")}
                </div>
              </div>
            </article>

            <article class="rounded-3xl border border-slate-200 bg-slate-50 p-5">
              <div class="text-lg font-black text-slate-950">${supportNotes.firstReadTitle}</div>
              <p class="mt-2 text-sm leading-7 text-slate-700">${supportNotes.firstReadNote}</p>
              <div class="mt-4 overflow-hidden rounded-2xl border border-slate-200">
                <div class="grid grid-cols-[0.9fr_0.9fr_1.5fr] gap-px bg-slate-200">
                  <div class="bg-slate-50 px-4 py-3 text-sm font-bold">최초 인식 시간</div>
                  <div class="bg-slate-50 px-4 py-3 text-sm font-bold">판정</div>
                  <div class="bg-slate-50 px-4 py-3 text-sm font-bold">해석</div>
                  ${supportNotes.firstReadRows
                    .map(
                      (row) => `
                        <div class="bg-white px-4 py-4 text-sm font-semibold text-slate-900">${row.range}</div>
                        <div class="px-4 py-4 text-sm font-bold ${toneMap[row.tone]}">${row.grade}</div>
                        <div class="bg-white px-4 py-4 text-sm text-slate-700">${row.meaning}</div>
                      `,
                    )
                    .join("")}
                </div>
              </div>
            </article>
          </div>
        </section>

        ${antennaReviewSectionHtml()}
      </div>
    `;

    const topNav = app.querySelector("nav.sticky");
    if (topNav) {
      topNav.remove();
    }

    const rightNavContainer = app.querySelector("aside .grid");
    if (rightNavContainer) {
      const targets = [
        "impact-summary",
        "test-scope",
        "current-judgment",
        "issue-causes",
        "conditions",
        "examples-hook",
        "examples-floor",
        "human-impact",
        "antenna-position",
        "external-evidence",
        "interpretation-rules",
        "antenna-review",
      ];

      const navItems = [{ href: "#top", label: "맨 위" }];

      targets.forEach((id) => {
        const section = document.getElementById(id);
        if (!section) return;
        const heading = section.querySelector("h1, h2, h3");
        navItems.push({
          href: `#${id}`,
          label: heading ? heading.textContent.trim() : id,
        });
      });

      rightNavContainer.innerHTML = navItems
        .map(
          (item) => `
            <a href="${item.href}" class="rounded-2xl border border-slate-200 bg-slate-50 px-3 py-2 text-xs font-semibold text-slate-700 transition hover:border-sky-300 hover:bg-sky-50 hover:text-sky-800">
              ${item.label}
            </a>
          `,
        )
        .join("");
    }

    const openModal = (src, label, openUrl) => {
      modal.classList.remove("hidden");
      modalContent.innerHTML = `
        <div class="overflow-hidden bg-white">
          <div class="border-b border-slate-200 px-5 py-4">
            <div class="text-sm font-semibold text-slate-500">${label || "이미지"}</div>
          </div>
          <div class="bg-slate-50 p-4">
            <img src="${src}" alt="${label || "이미지"}" class="max-h-[78vh] w-full object-contain" referrerpolicy="no-referrer" />
          </div>
          <div class="flex items-center justify-end gap-4 border-t border-slate-200 px-5 py-4">
            <a href="${openUrl}" target="_blank" class="text-sm font-semibold text-sky-700 underline">새 탭 열기</a>
          </div>
        </div>
      `;
    };

    document.addEventListener("click", (event) => {
      const trigger = event.target.closest(".image-trigger");
      if (trigger) {
        openModal(trigger.dataset.src, trigger.dataset.label, trigger.dataset.open);
      }
    });

    closeModal.addEventListener("click", () => {
      modal.classList.add("hidden");
      modalContent.innerHTML = "";
    });

    modal.addEventListener("click", (event) => {
      if (event.target === modal) {
        modal.classList.add("hidden");
        modalContent.innerHTML = "";
      }
    });
  </script>
  <script src="./common_section_nav.js"></script>
  <script src="./common_auto_reload.js"></script>
</body>
</html>
