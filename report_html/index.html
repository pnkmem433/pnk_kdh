<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>보고서 홈</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background:
        radial-gradient(circle at top left, rgba(14, 165, 233, 0.12), transparent 28%),
        radial-gradient(circle at top right, rgba(16, 185, 129, 0.10), transparent 24%),
        #f8fafc;
    }

    .shadow-soft {
      box-shadow: 0 18px 48px rgba(15, 23, 42, 0.08);
    }
  </style>
</head>
<body class="min-h-screen text-slate-900">
  <main class="mx-auto max-w-6xl px-6 py-14 lg:px-8">
    <section class="rounded-[2rem] border border-slate-200 bg-white p-8 shadow-soft lg:p-12">
      <div class="inline-flex rounded-full border border-sky-200 bg-sky-50 px-4 py-1 text-xs font-semibold uppercase tracking-[0.22em] text-sky-800">
        Report Home
      </div>
      <h1 class="mt-5 text-4xl font-black tracking-tight text-slate-950 lg:text-5xl">보고서 홈</h1>
      <p class="mt-4 max-w-3xl text-base leading-8 text-slate-600">
        프로젝트별 HTML 보고서를 한곳에서 바로 열 수 있도록 정리한 메뉴입니다.
      </p>
    </section>

    <section class="mt-8 grid gap-6 lg:grid-cols-3">
      <a href="./styling_booth/" class="group rounded-[2rem] border border-slate-200 bg-white p-7 shadow-soft transition hover:-translate-y-1 hover:border-sky-300 hover:shadow-xl">
        <div class="text-xs font-semibold uppercase tracking-[0.18em] text-slate-500">Report 01</div>
        <div class="mt-4 text-2xl font-black text-slate-950">스타일링 부스</div>
        <p class="mt-3 text-sm leading-7 text-slate-600">RFID 테스트 결과, 안테나 위치, 인식 실패 원인을 정리한 보고서 아카이브</p>
        <div class="mt-6 text-sm font-semibold text-sky-700 group-hover:text-sky-800">열기</div>
      </a>

      <a href="./smart_plug/" class="group rounded-[2rem] border border-slate-200 bg-white p-7 shadow-soft transition hover:-translate-y-1 hover:border-emerald-300 hover:shadow-xl">
        <div class="text-xs font-semibold uppercase tracking-[0.18em] text-slate-500">Report 02</div>
        <div class="mt-4 text-2xl font-black text-slate-950">스마트 플러그</div>
        <p class="mt-3 text-sm leading-7 text-slate-600">릴레이 제어, 전력 측정, 펌웨어 기록을 날짜별로 모아보는 아카이브</p>
        <div class="mt-6 text-sm font-semibold text-emerald-700 group-hover:text-emerald-800">열기</div>
      </a>

      <a href="./esp_now/" class="group rounded-[2rem] border border-slate-200 bg-white p-7 shadow-soft transition hover:-translate-y-1 hover:border-violet-300 hover:shadow-xl">
        <div class="text-xs font-semibold uppercase tracking-[0.18em] text-slate-500">Report 03</div>
        <div class="mt-4 text-2xl font-black text-slate-950">ESP-NOW</div>
        <p class="mt-3 text-sm leading-7 text-slate-600">무선 통신 테스트와 구현 기록을 모아두는 아카이브</p>
        <div class="mt-6 text-sm font-semibold text-violet-700 group-hover:text-violet-800">열기</div>
      </a>
    </section>
</main>
<script src="./common_auto_reload.js"></script>
</body>
</html>
