[env:tasmota-smartplug]
extends                 = env:tasmota-lite
; ESP-02S uses an ESP8285 and must use DOUT so Tasmota settings persist reliably.
board                   = esp8285
board_build.flash_mode  = dout
extra_scripts           = ${env:tasmota-lite.extra_scripts}
                          pre:pio-tools/set-code-image.py
                          post:pio-tools/copy-gdrive-firmware.py
platform_packages       = toolchain-xtensa@symlink://C:/WS/vs_kdh/pnk_kdh/tasmota/.platformio-core/packages/toolchain-xtensa
build_flags             = ${env:tasmota-lite.build_flags}
                          ; Keep Tasmota's 1MB/no-extra-filesystem behavior while using the ESP8285 board profile.
                          -DESP8266_1M
                          -DUSE_SMARTPLUG_CUSTOM
                          -DMQTT_MAX_PACKET_SIZE=512
                          -DLOG_LEVEL=0
