; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino

; 단일 보드: 로컬 도어 GPIO + RFID + LED(MQTT) + CC-Retail_mvp0.0 HTTP
; DOOR_SENSOR_PIN: GPIO 번호(기본 2). 보드 핀맵에 맞게 조정.
; LED_STRIP_UUID: led_test 가 구독하는 led_strip UUID 와 일치해야 함.

monitor_filters = esp32_exception_decoder
monitor_speed = 115200
build_flags =
    -DAPI_HOST=\"gym907-0001.iptime.org\"
    -DAPI_PORT=3010
    -DMQTT_HOST=\"gym907-0001.iptime.org\"
    -DMQTT_PORT=1883
    -DMQTT_USER=\"pnks\"
    -DMQTT_PASS=\"pnks1111\"
    -DDOOR_SENSOR_PIN=D1
    -DDOOR_SENSOR_LABEL=\"D1(GPIO3)\"
    -DDOOR_SENSOR_CLOSED_LEVEL=HIGH
    -DDOOR_SENSOR_PIN_MODE=INPUT_PULLDOWN
    -DDOOR_DEBOUNCE_MS=250
    -DDOOR_SCAN_WINDOW_MS=10000UL
    -DHTTP_VERBOSE_HEADERS=0
    -DHTTP_VERBOSE_CONNECTION=0
    -DENABLE_MQTT=0
    -DSENSOR_QUEUE_LOG=0
    -DLAN_CS_PIN=D5
    -DLED_STRIP_UUID=\"9642C3BA-FC4A-4B07-A0E0-9153D323EC06\"
    -DFITTING_ROOM_ID=1
    -DRFID_MIN_READ_COUNT=5
    -DRFID_TAG_SUBSTRING_START=5
    -DRFID_TAG_SUBSTRING_END=13

lib_deps =
    UIPEthernet
    https://github.com/ChuckBell/MySQL_Connector_Arduino
    bblanchon/ArduinoJson
