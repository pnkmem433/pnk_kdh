version: '3.8'

services:
  fxco-hmi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fxco-hmi-prod
    ports:
      - "3000:3000"
    # 프로덕션에서는 환경 변수를 직접 지정하거나
    # Docker secrets, 환경 변수 파일 등을 사용
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - PORT=${PORT:-3000}
      - NODE_ENV=production
    restart: always
    networks:
      - fxco-network

networks:
  fxco-network:
    driver: bridge




