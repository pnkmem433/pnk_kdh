<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clothes List</title>
  <style>
    @font-face {
    font-family: 'Pretendard';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Thin.woff2') format('woff2');

    }

    @font-face {

        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-ExtraLight.woff2') format('woff2');
        font-weight: 200;
        font-display: swap;
    }

    @font-face {
        font-family: 'Pretendard';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Light.woff2') format('woff2');
        font-weight: 300;
        font-display: swap;
    }

    @font-face {
        font-family: 'Pretendard';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Regular.woff2') format('woff2');
        font-weight: 400;
        font-display: swap;
    }

    @font-face {
        font-family: 'Pretendard';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Medium.woff2') format('woff2');
        font-weight: 500;
        font-display: swap;
    }

    @font-face {
        font-family: 'Pretendard';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-SemiBold.woff2') format('woff2');
        font-weight: 600;
        font-display: swap;
    }

    @font-face {
        font-family: 'Pretendard';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Bold.woff2') format('woff2');
        font-weight: 700;
        font-display: swap;
    }

    @font-face {
        font-family: 'Pretendard';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-ExtraBold.woff2') format('woff2');
        font-weight: 800;
        font-display: swap;
    }

    @font-face {
        font-family: 'Pretendard';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Black.woff2') format('woff2');
        font-weight: 900;
        font-display: swap;
    }

    @font-face {
    font-family: 'Paperozi';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2') format('woff2');
    font-weight: 600;
    font-display: swap;
    }

  <style>
    :root { --max: 720px; }

    body {
      margin: 0;
      background: #fff;
      color: #1a1a1a;
      font-family: 'Pretendard', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .header {
      position: relative;
      max-width: var(--max);
      margin: 32px auto 24px;
      box-sizing: border-box;
      height: 48px; /* 버튼/로고 영역 높이 확보 */
    }

    .logo {
      position: absolute;              /* 🔥 header 영향 완전 차단 */
      left: 50vw;                   /* 화면 가로 정중앙 */
      top: 32px + 24px;             /* header의 실제 위치에 맞게 조정 */
      transform: translateX(-50%);
      width: 150px;
      z-index: 1;
      width: 100px;
    }

    .wrap { max-width: var(--max); margin: 0 auto; padding: 16px; box-sizing: border-box; }

    .list {
      display: grid;
      grid-template-columns: repeat(2, 1fr); /* 2열 */
      gap: 12px;
      max-width: 720px;
      margin: 0 auto;
    }

    .item {
      width: 100%;
      aspect-ratio: 3 / 4;
      height: 80px;
      border-radius: 8px;
      overflow: hidden;
      background: #f5f5f5;
      display: flex;
      align-items: center;      /* 세로 중앙 */
      justify-content: center;  /* 가로 중앙 */
    }

    .item img {
      max-width: 100%;
      object-fit: fill;    /* 가운데 정렬 + 잘림 방지 */
      display: block;
    }

    
    .guide {
      margin-top: 3em;
      text-align: center;
      word-break: keep-all;
      font-size: 1em;
    }

    .powered {
      margin-top: 2em;
      margin-bottom: 0.5em;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .k {
      font-weight: 400;
      color:#999999;
      font-size: 12px;
    }

    .powered > .k {
      color: #cccccc;
      padding: 6px 12px 6px 12px;
      text-decoration: none;
      cursor: pointer;
    }
    .powered > .k:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <img class="logo" src="./images/INST_logo.png" alt="INST logo" />
  </div>
  <div class="wrap">
    <div class="list" id="list"></div>
    
    <div class="guide">
      <p class="guideText">입는 순간 더 빛나는 모습을 만나보세요.</p>
      <p class="guideText">스타일링 부스에서 영상으로 어울림을 확인하고,</p>
      <p class="guideText">나에게 꼭 맞는 분위기를 느껴보는 특별한 시간.</p>
    </div>
      
    <div class="powered">
      <a href="https://satin-narrow-57476246.figma.site/" target="_blank" rel="noopener noreferrer" class="k">
        Powered by PNK SOLUTION
      </a>
    </div>


    <div class="error" id="error" style="display:none;"></div>
  </div>
  <script>
    async function loadList() {
      const res = await fetch('./data.json', { cache: 'no-store' });
      const data = await res.json();

      const listEl = document.getElementById('list');

      data.forEach(item => {
        const link = document.createElement('a');
        link.href = `detail.html?code=${item.tag}`;
        link.style.textDecoration = 'none';

        const wrap = document.createElement('div');
        wrap.className = 'item';

        const img = document.createElement('img');
        img.src = `./images/${item.tag}.jpg`;
        img.alt = item.tag;

        wrap.appendChild(img);
        link.appendChild(wrap);
        listEl.appendChild(link);
      });

    }

    loadList();
  </script>
</body>
</html>
